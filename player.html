<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>漫花鹿Pro · 播放器</title>
<link rel="icon" href="appicon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#0f1216;color:#e9edf5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.player{width:100%;max-width:360px;padding:22px 20px 26px;margin:16px;
 background:linear-gradient(180deg,#20262f,#171b21 60%,#12151a);border:1px solid #2c3440;border-radius:22px;
 box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:2px;color:#7f8b9e;text-transform:uppercase}
.brand img{width:20px;height:20px;border-radius:6px}
.screen{margin-top:16px;padding:14px;border-radius:14px;background:#0a0d11;border:1px solid #262e39;
 box-shadow:inset 0 2px 10px rgba(0,0,0,.7)}
.cover{width:100%;aspect-ratio:1/1;max-height:190px;object-fit:cover;border-radius:10px;display:block;background:#1b2028}
.ph{width:100%;height:150px;border-radius:10px;background:repeating-linear-gradient(135deg,#1b2028,#1b2028 8px,#202833 8px,#202833 16px);
 display:flex;align-items:center;justify-content:center;font-size:30px;color:#4b5566}
.meta{margin-top:12px;text-align:center}
.nm{font-size:16px;font-weight:800;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{font-size:12px;color:#8b96a8;margin-top:4px}
.bar{margin-top:14px;height:6px;border-radius:999px;background:#1d2530;overflow:hidden;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f6df6,#7fb3ff)}
.tm{display:flex;justify-content:space-between;font-size:11px;color:#7f8b9e;margin-top:6px;font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:18px}
.btn{width:56px;height:56px;border-radius:50%;border:1px solid #333c4a;background:linear-gradient(180deg,#2b333f,#20262f);color:#e9edf5;
 display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.btn.main{width:66px;height:66px;background:linear-gradient(180deg,#3b7bff,#2456d6);border-color:#4b86ff}
.btn svg{display:block}
.btn:active{transform:translateY(1px)}
.side{width:40px;height:40px;border-radius:50%;border:1px solid #2c3440;background:#1a1f27;color:#9aa6b8;display:flex;align-items:center;justify-content:center;font-size:11px}
.foot{margin-top:16px;text-align:center;font-size:11px;color:#5f6b7d;line-height:1.8}
.tip{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:rgba(24,30,40,.94);color:#fff;font-size:13px;
 padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none}
.tip.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="player">
  <div class="brand"><img src="appicon.png" alt=""><span>漫花鹿Pro · 播放器</span></div>
  <div class="screen">
    <img class="cover" id="cv" alt="" style="display:none">
    <div class="ph" id="cvPh">♪</div>
    <div class="meta"><div class="nm" id="nm">正在加载…</div><div class="ar" id="ar"></div></div>
    <div class="bar" id="bar"><i id="prog"></i></div>
    <div class="tm"><span id="cur">00:00</span><span id="dur">00:00</span></div>
  </div>
  <div class="ctrl">
    <div class="side" id="mut">静音</div>
    <button class="btn main" id="pp">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path id="ppIcon" d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="side" id="loop">循环</div>
  </div>
  <div class="foot" id="foot">进入即自动播放 · 漫花鹿 Pro</div>
</div>
<div class="tip" id="tip"></div>
<audio id="au" preload="auto" playsinline></audio>
<script>
var Q=new URLSearchParams(location.search);
var ID=Q.get('id')||'', NM=Q.get('n')||'', AR=Q.get('a')||'', CV=Q.get('c')||'';
var au=document.getElementById('au'), tipEl=document.getElementById('tip');
function $(i){return document.getElementById(i)}
function toast(t){tipEl.textContent=t;tipEl.classList.add('on');clearTimeout(window.__t);window.__t=setTimeout(function(){tipEl.classList.remove('on')},2000)}
function two(n){n=Math.max(0,Math.floor(n||0));return (n<10?'0':'')+Math.floor(n/60)+':'+(n%60<10?'0':'')+(n%60)}
if(NM)$('nm').textContent=NM; if(AR)$('ar').textContent=AR;
if(CV){$('cv').src=CV;$('cv').style.display='block';$('cvPh').style.display='none'}
var urls=[];
if(ID){
  urls.push('https://music.163.com/song/media/outer/url?id='+encodeURIComponent(ID)+'.mp3');
  urls.push('https://api.injahow.cn/meting/?type=url&id='+encodeURIComponent(ID));
}
var ui=0, tried=0;
function srcNext(){
  if(ui>=urls.length){$('foot').textContent='这首歌取不到播放地址，换网络再试';toast('取不到播放地址');return}
  au.src=urls[ui]; au.load();
  var p=au.play();
  if(p&&p.catch)p.catch(function(){ /* 自动播放被拦，等用户点 */ });
}
au.addEventListener('canplay',function(){ if(au.paused){var p=au.play(); if(p&&p.catch)p.catch(function(){toast('点一下播放键开始')});} });
au.addEventListener('error',function(){ ui++; if(ui<urls.length){srcNext()} else {$('foot').textContent='这首歌暂时取不到播放地址'} });
au.addEventListener('timeupdate',function(){
  var d=au.duration||0, c=au.currentTime||0;
  $('prog').style.width=(d?(c/d*100):0)+'%';
  $('cur').textContent=two(c); $('dur').textContent=two(d);
});
au.addEventListener('ended',function(){ if(looping){au.currentTime=0;au.play()} });
au.addEventListener('play',function(){ setIcon(true); $('foot').textContent='正在播放 · 漫花鹿 Pro'; });
au.addEventListener('pause',function(){ setIcon(false); });
var looping=true, muted=false;
function setIcon(playing){
  $('ppIcon').setAttribute('d', playing?'M8 5h3v14H8zM13 5h3v14h-3z':'M8 5v14l11-7z');
}
$('pp').onclick=function(){
  if(au.paused){ var p=au.play(); if(p&&p.catch)p.catch(function(){toast('播放失败，换网络再试')}); }
  else au.pause();
};
$('loop').onclick=function(){ looping=!looping; $('loop').textContent=looping?'循环':'单次'; toast(looping?'列表循环':'播完停'); };
$('mut').onclick=function(){ muted=!muted; au.muted=muted; $('mut').textContent=muted?'已静音':'静音'; };
$('bar').onclick=function(e){
  var r=this.getBoundingClientRect(), x=(e.clientX-r.left)/r.width;
  if(au.duration)au.currentTime=Math.max(0,Math.min(1,x))*au.duration;
};
srcNext();
</script>
</body>
</html>
