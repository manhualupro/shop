<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的网站</title>
<style>
  html,body{height:100%;margin:0;background:#0b0f1a}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa7bd;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#fff}
  #err{display:none}
  iframe{border:0;width:100%;height:100%;position:fixed;inset:0}
</style>
</head>
<body>
<div id="load"><span id="tip">正在打开网站…</span></div>
<iframe id="fr" style="display:none"></iframe>
<script>
(function(){
  var SB='https://fjarlttqnznykmvlsxma.supabase.co/storage/v1/object/public/sites/';
  function qs(k){var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1]):''}
  var site=qs('s'), page=qs('p')||'index.html';
  var tip=document.getElementById('tip');
  if(!site){tip.textContent='缺少站点标识（链接里的 s 参数）';return}
  var base=SB+encodeURIComponent(site)+'/';
  function grab(p){return fetch(base+p+'?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.text()})}
  grab(page).catch(function(){
    if(page==='index.html')return grab('index.htm');
    throw 0;
  }).catch(function(){return grab('index.html')}).then(function(txt){
    // 注入 base，保证图片、音乐、css 的相对路径都能取到
    var inject='<base href="'+base+'">';
    if(/<head[^>]*>/i.test(txt)){txt=txt.replace(/<head([^>]*)>/i,function(m,a){return '<head'+a+'>'+inject})}
    else{txt=inject+txt}
    var fr=document.getElementById('fr');
    fr.onload=function(){document.getElementById('load').style.display='none';fr.style.display='block'};
    fr.srcdoc=txt;
    setTimeout(function(){document.getElementById('load').style.display='none';fr.style.display='block'},1200);
  }).catch(function(){
    tip.innerHTML='没找到这个网站：<b>'+site.replace(/[<>&]/g,'')+'</b><br>① 进 App 点「个人网站」确认后缀是这一个；<br>② 如果刚重新上传，等 1 分钟再刷新；<br>③ 还是不行就在 App 里点「重新部署」重新上传一次。';
  });
})();
</script>
</body>
</html>
