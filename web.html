<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>漫花鹿Pro 网页版</title><link rel="icon" href="appicon.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#eef4ff,#f7f9ff 42%,#fff);color:#22262f;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:26px 18px 40px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand img{width:46px;height:46px;border-radius:12px;background:#fff;object-fit:cover}
.brand b{font-size:19px}
.hero{background:#fff;border-radius:18px;padding:20px;box-shadow:0 10px 28px rgba(40,70,140,.09);border:1px solid #e9effb}
.hero h1{margin:0 0 6px;font-size:20px}
.hero p{margin:0;color:#6b7280;font-size:13.5px;line-height:1.7}
.field{margin-top:16px}
.field input{width:100%;height:46px;border-radius:12px;border:1px solid #e2e9f6;background:#f8faff;padding:0 14px;font-size:14px;outline:none}
.field input:focus{border-color:#2f6df6;background:#fff}
.btn{display:block;width:100%;height:46px;border-radius:12px;border:0;background:#2f6df6;color:#fff;font-size:15px;font-weight:700;margin-top:12px;cursor:pointer}
.btn.ghost{background:#fff;color:#2f6df6;border:1px solid #cfdefc}
.tip{font-size:12px;color:#9aa3b2;margin-top:10px;line-height:1.6}
.card{margin-top:18px;background:#fff;border-radius:16px;border:1px solid #e9effb;padding:16px}
.card h2{margin:0 0 10px;font-size:15px}
.card ul{margin:0;padding-left:18px;color:#555c6b;font-size:13.5px;line-height:1.9}
.foot{text-align:center;color:#a8b0bd;font-size:12px;margin-top:26px;line-height:1.8}
</style></head><body>
<div class="wrap">
  <div class="brand"><img src="appicon.png" alt=""><b>漫花鹿Pro 网页版</b></div>
  <div class="hero">
    <h1>输入店铺地址，在线进店</h1>
    <p>填店铺后缀、短链接或完整地址都行。想管理自己的店，用 App 里的「店铺链接」复制短链接发出去即可。</p>
    <div class="field"><input id="q" placeholder="例如 mhl1a2b 或 xiaoyue" autocomplete="off"></div>
    <button class="btn" id="go">进入店铺</button>
    <button class="btn ghost" id="dl">下载漫花鹿Pro App</button>
    <div class="tip">网页版只做浏览与下单，商品编辑、公告、卡密这些在 App 里改。</div>
  </div>
  <div class="card"><h2>网页版能做什么</h2>
    <ul><li>在线看店铺商品、库存与价格</li><li>下单后查看订单与卡密</li><li>短链接可直接分享给客人</li></ul>
  </div>
  <div class="foot">漫花鹿Pro · 网页版<br>© 2026 manhualupro</div>
</div>
<script>
function go(){
  var v=(document.getElementById('q').value||'').trim();
  if(!v){alert('先填店铺地址或短码');return}
  v=v.replace(/^https?:\/\//,'');
  var m=v.match(/shop\/([^\/?#]+)/);
  if(m)v=m[1];
  v=v.replace(/\/+$/,'');
  location.href='./'+encodeURIComponent(v);
}
document.getElementById('go').onclick=go;
document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
document.getElementById('dl').onclick=function(){location.href='./download.html'};
</script></body></html>
