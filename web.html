<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>漫花鹿Pro 网页版</title>
<meta name="theme-color" content="#2f6df6">
<link rel="icon" href="appicon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
 background:#f4f6fb;color:#161c2b;overflow:hidden}
/* ---------- 登录 ---------- */
#login{position:fixed;inset:0;background:linear-gradient(165deg,#e9f1ff 0%,#f7fbff 46%,#ffffff 100%);
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;z-index:30}
#login .lg-icon{width:78px;height:78px;border-radius:22px;box-shadow:0 12px 26px rgba(24,42,84,.16)}
#login h1{font-size:23px;margin:18px 0 4px;letter-spacing:.5px}
#login p{margin:0;color:#6d768a;font-size:13px}
.lg-box{width:100%;max-width:380px;margin-top:26px}
.lg-in{width:100%;height:50px;border:1px solid #dfe7f5;background:#fff;border-radius:14px;
 padding:0 16px;font-size:15px;outline:none;margin-bottom:12px;font-family:inherit}
.lg-in:focus{border-color:#9dc0ff}
.lg-btn{width:100%;height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,#2f6df6,#5a9bff);
 color:#fff;font-size:16px;font-weight:800;box-shadow:0 10px 22px rgba(47,109,246,.28)}
.lg-sub{width:100%;height:46px;border:1px solid #dfe7f5;background:#fff;border-radius:14px;color:#33405a;
 font-size:14.5px;font-weight:700;margin-top:10px}
.lg-auth{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;color:#5a6478;font-size:13px}
.lg-circle{width:46px;height:46px;border-radius:50%;border:2px solid #2f6df6;padding:0;overflow:hidden;background:#fff;
 box-shadow:0 6px 16px rgba(47,109,246,.22);display:flex;align-items:center;justify-content:center}
.lg-circle img{width:38px;height:38px;border-radius:50%;object-fit:cover;display:block}
/* ---------- 授权流程 ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,38,.5);display:flex;align-items:center;justify-content:center;
 padding:22px;z-index:60}
.dlg{width:100%;max-width:340px;background:#fff;border-radius:20px;padding:22px 20px 18px;text-align:center;
 box-shadow:0 18px 44px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 8px;font-size:18px}
.dlg .dg-tx{font-size:13.5px;line-height:1.75;color:#5b6478}
.dlg .dg-btns{display:flex;gap:10px;margin-top:18px}
.dlg .dg-btns button{flex:1;height:44px;border-radius:12px;border:0;font-size:14.5px;font-weight:800}
.dg-no{background:#eff2f7;color:#4a5468}
.dg-yes{background:#2f6df6;color:#fff}
.dg-spin{width:44px;height:44px;border-radius:50%;border:3px solid #e4ecfb;border-top-color:#2f6df6;
 margin:6px auto 12px;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dg-ok{width:46px;height:46px;border-radius:50%;background:#e8f8ee;color:#22b455;font-size:24px;font-weight:800;
 display:flex;align-items:center;justify-content:center;margin:4px auto 12px}
/* ---------- 工作台 ---------- */
#app{position:fixed;inset:0;display:none;flex-direction:column;background:#f4f6fb}
#app.on{display:flex}
.pg-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
 background:#fff;border-bottom:1px solid #eef1f7}
.pg-top .tt{font-size:16px;font-weight:800}
.pg-top .rt{font-size:12px;color:#2f6df6;font-weight:700;background:#eaf1ff;padding:5px 11px;border-radius:999px}
#pages{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 18px}
.nav{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid #eef1f7;padding:6px 4px 8px}
.nav .nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:#8a93a6;
 padding:4px 0;border:0;background:none}
.nav .nv.on{color:#2f6df6;font-weight:800}
.nav .nv svg{width:21px;height:21px;display:block}
.card{background:#fff;border:1px solid #e9eefa;border-radius:16px;padding:14px 16px;margin-bottom:12px;
 box-shadow:0 6px 16px rgba(24,42,84,.05)}
.card-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;color:#5f6a80;margin-bottom:10px}
.shop-row{display:flex;align-items:center;gap:12px}
.shop-ic{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#2f6df6,#7fb2ff);color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.shop-m{flex:1;min-width:0}
.shop-nm{font-size:16px;font-weight:800}
.shop-sl{font-size:12px;color:#8a93a6;margin-top:4px}
.stat3{display:flex;margin-top:14px;border-top:1px solid #f1f4fa;padding-top:12px}
.stat3 div{flex:1;text-align:center}
.stat3 b{display:block;font-size:17px;font-weight:800;color:#161c2b}
.stat3 span{font-size:11.5px;color:#8a93a6}
.prow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f2f5fa;font-size:14px}
.prow:last-child{border-bottom:0}
.prow .k{color:#2b3346}
.prow .v{color:#8a93a6;font-size:12.5px;display:flex;align-items:center;gap:6px}
.link-a{color:#2f6df6;font-weight:700;text-decoration:none;font-size:13px}
.msg-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed #eef2f9}
.msg-item:last-child{border-bottom:0}
.msg-av{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:linear-gradient(135deg,#2f6df6,#7fb2ff);
 color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.msg-c{flex:1;min-width:0}
.msg-h{display:flex;justify-content:space-between;font-size:12px;color:#98a1b2}
.msg-h b{color:#33405a;font-size:12.5px}
.msg-t{font-size:13.5px;line-height:1.7;color:#242c3d;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.empty{text-align:center;color:#a2aab9;font-size:13px;padding:30px 0}
.reply-row{display:flex;gap:8px;margin-top:12px}
.reply-row input{flex:1;height:42px;border:1px solid #e2e9f6;border-radius:11px;padding:0 12px;font-size:13.5px;outline:none;font-family:inherit}
.reply-row button{width:74px;height:42px;border:0;border-radius:11px;background:#2f6df6;color:#fff;font-size:13.5px;font-weight:800}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,18px);background:rgba(28,36,52,.92);color:#fff;
 font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.upd{position:fixed;inset:0;background:rgba(16,24,38,.5);display:none;align-items:center;justify-content:center;padding:22px;z-index:70}
.upd.on{display:flex}
.upd-card{width:100%;max-width:330px;background:#fff;border-radius:18px;padding:20px 18px 16px;text-align:center}
.upd-card h3{margin:0 0 6px;font-size:17px}
.upd-card .uv{font-size:12.5px;color:#8a93a6;margin-bottom:10px}
.upd-card .ut{font-size:13px;line-height:1.7;color:#5b6478;text-align:left;max-height:150px;overflow-y:auto;white-space:pre-wrap}
.upd-card .ub{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.upd-card .ub a,.upd-card .ub button{height:46px;border-radius:12px;border:0;font-size:14.5px;font-weight:800;
 display:flex;align-items:center;justify-content:center;text-decoration:none}
.ub-dl{background:linear-gradient(135deg,#2f6df6,#5a9bff);color:#fff}
.ub-go{background:#eff2f7;color:#434e64}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <img class="lg-icon" src="appicon.png" alt="">
  <h1>漫花鹿Pro 网页版</h1>
  <p>同一个账号，在电脑上也能搭建发卡网站</p>
  <div class="lg-box">
    <input class="lg-in" id="lgName" placeholder="输入漫花鹿Pro账号（邮箱或店铺后缀）">
    <button class="lg-btn" id="lgBtn">登录</button>
    <button class="lg-sub" id="lgReg">注册新账号</button>
  </div>
  <div class="lg-auth">
    <button class="lg-circle" id="authBtn"><img src="appicon.png" alt=""></button>
    <span>使用漫花鹿Pro 授权登录</span>
  </div>
</div>

<!-- 工作台 -->
<div id="app">
  <div class="pg-top">
    <div class="tt" id="pgTitle">主页</div>
    <div class="rt" id="pgVer">v1.7.91</div>
  </div>
  <div id="pages"></div>
  <div class="nav">
    <button class="nv on" data-nav="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg>主页</button>
    <button class="nv" data-nav="msg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="18" height="13" rx="3"/><path d="M8 21l4-3"/></svg>消息</button>
    <button class="nv" data-nav="music">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>听歌</button>
    <button class="nv" data-nav="set">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>设置</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="upd" id="upd">
  <div class="upd-card">
    <h3>发现新版本</h3>
    <div class="uv" id="updV">最新版本 1.7.91</div>
    <div class="ut" id="updT"></div>
    <div class="ub">
      <a class="ub-dl" id="updDl" href="#" target="_blank" rel="noopener">下载 APK 软件版</a>
      <button class="ub-go" id="updGo">继续使用网页最新版本</button>
    </div>
  </div>
</div>

<script>
var SB='https://fjarlttqnznykmvlsxma.supabase.co/rest/v1';
var KEY='sb_publishable_2SUA34qjRy_yB_AgMYW81A_2KTzfL94';
var SLUG='xiaoyue';
var CUR={'ver':'1.7.91','apk':'https://aka.doubaocdn.com/s/IUQTjW0XAo','note':''};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(window.__tt);window.__tt=setTimeout(function(){e.classList.remove('on')},1800)}
function api(path,opt){
  opt=opt||{};opt.headers=Object.assign({'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},opt.headers||{});
  return fetch(SB+path,opt).then(function(r){return r.json()});
}
function acc(){try{return JSON.parse(localStorage.getItem('mhl_web_acc')||'null')}catch(e){return null}}
function setAcc(a){localStorage.setItem('mhl_web_acc',JSON.stringify(a))}

/* ============ 登录 / 授权 ============ */
function doLogin(name){
  var n=(name||'').trim();
  if(!n){toast('先填一下账号');return}
  setAcc({name:n,slug:SLUG,at:Date.now()});
  enterApp(n);
}
function enterApp(name){
  $('login').style.display='none';
  $('app').classList.add('on');
  $('pgVer').textContent='v'+CUR.ver;
  go('home');
  checkUpdate();
}
$('lgBtn').onclick=function(){doLogin($('lgName').value)};
$('lgReg').onclick=function(){
  var n=($('lgName').value||'').trim();
  if(!n){n='用户'+Math.floor(Math.random()*9000+1000)}
  doLogin(n);toast('账号已创建并登录');
};
$('lgName').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin(this.value)});

function dialog(html){var m=document.createElement('div');m.className='mask';m.innerHTML='<div class="dlg">'+html+'</div>';
  document.body.appendChild(m);return m}
$('authBtn').onclick=function(){
  var m=dialog('<h3>是否授权网页版漫花鹿登录？</h3>'+
    '<div class="dg-tx">授权后，网页版会使用你当前漫花鹿Pro的账号登录，店铺、商品、订单都会保持一致。</div>'+
    '<div class="dg-btns"><button class="dg-no">取消</button><button class="dg-yes">是，授权</button></div>');
  m.querySelector('.dg-no').onclick=function(){m.remove()};
  m.querySelector('.dg-yes').onclick=function(){
    m.innerHTML='<div class="dg-spin"></div><h3>授权完成，请稍候…</h3><div class="dg-tx">正在把授权信息写入网页版</div>';
    setTimeout(function(){
      m.innerHTML='<div class="dg-spin"></div><h3>授权成功，正在登录…</h3><div class="dg-tx">正在同步你的店铺数据</div>';
      setTimeout(function(){
        m.innerHTML='<div class="dg-ok">✓</div><h3>登录完成</h3><div class="dg-tx">欢迎回来</div>';
        setTimeout(function(){m.remove();
          var a=acc();doLogin((a&&a.name)||'漫花鹿Pro用户');
        },900);
      },1300);
    },1200);
  };
};

/* ============ 页面 ============ */
var TAB='home';
function go(t){
  TAB=t;
  var nvs=document.querySelectorAll('.nav .nv');
  for(var i=0;i<nvs.length;i++)nvs[i].classList.toggle('on',nvs[i].getAttribute('data-nav')===t);
  var titles={home:'主页',msg:'消息',music:'听歌',set:'设置'};
  $('pgTitle').textContent=titles[t]||'主页';
  if(t==='home')renderHome();
  if(t==='msg')renderMsg();
  if(t==='music')renderMusic();
  if(t==='set')renderSet();
}
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-nav]'):null;
  if(b)go(b.getAttribute('data-nav'));
});

function renderHome(){
  $('pages').innerHTML='<div class="card" id="homeCard"><div class="empty">加载中…</div></div>'+
    '<div class="card"><div class="card-h">快捷入口</div>'+
    '<div class="prow"><span class="k">店铺公网地址</span><a class="link-a" id="homePub" href="#" target="_blank">打开</a></div>'+
    '<div class="prow"><span class="k">下载最新 APK</span><a class="link-a" id="homeDl" href="#">下载</a></div></div>';
  api('/shop?select=data&k=eq.'+SLUG).then(function(rows){
    var s=(rows&&rows[0]&&rows[0].data)||{};
    var prods=(s.prods||[]).length;
    var pub='https://manhualupro.github.io/shop/'+(s.slug||SLUG);
    $('homePub').href=pub;
    $('homeDl').href=CUR.apk;
    $('homeCard').innerHTML='<div class="card-h">我的店铺</div>'+
      '<div class="shop-row"><div class="shop-ic">'+esc(String(s.name||'漫').slice(0,1))+'</div>'+
      '<div class="shop-m"><div class="shop-nm">'+esc(s.name||'未命名店铺')+'</div>'+
      '<div class="shop-sl">/shop/'+esc(s.slug||SLUG)+'</div></div></div>'+
      '<div class="stat3"><div><b>'+prods+'</b><span>商品</span></div>'+
      '<div><b>'+(s.sales||0)+'</b><span>成交</span></div>'+
      '<div><b>'+(Math.round(Number(s.bond||0)*10)/10)+'</b><span>保证金(元)</span></div></div>';
  }).catch(function(){$('homeCard').innerHTML='<div class="empty">店铺数据读取失败，稍后再试</div>'});
}

function renderMsg(){
  $('pages').innerHTML='<div class="card"><div class="card-h">买家与访客留言</div><div id="msgBox"><div class="empty">加载中…</div></div>'+
    '<div class="reply-row"><input id="rpTx" placeholder="回复这条留言…"><button id="rpBtn">回复</button></div></div>';
  loadMsg();
}
function loadMsg(){
  api('/shop?select=data&k=eq.msg').then(function(rows){
    var list=((rows&&rows[0]&&rows[0].data)||{}).list||[];
    if(!list.length){$('msgBox').innerHTML='<div class="empty">还没有留言</div>';return}
    $('msgBox').innerHTML=list.slice(0,20).map(function(m){
      var re=(m.reply?('<div style="margin-top:8px;background:#eef5ff;border-radius:10px;padding:8px 10px;font-size:12.5px;color:#2f6df6;line-height:1.7">回复：'+esc(m.reply)+'</div>'):'');
      return '<div class="msg-item"><div class="msg-av">'+esc(String(m.name||'漫').slice(0,1))+'</div>'+
        '<div class="msg-c"><div class="msg-h"><b>'+esc(m.name||'匿名')+'</b><span>'+esc(m.at||'')+'</span></div>'+
        '<div class="msg-t">'+esc(m.txt)+'</div>'+re+'</div></div>';
    }).join('');
    window.__msgs=list;
  }).catch(function(){$('msgBox').innerHTML='<div class="empty">读取失败</div>'});
}
document.addEventListener('click',function(e){
  if(!e.target.closest)return;
  var b=e.target.closest('#rpBtn');if(!b)return;
  var tx=$('rpTx').value.trim();if(!tx){toast('先写回复内容');return}
  var list=window.__msgs||[];
  if(!list.length){toast('没有可回复的留言');return}
  list[0].reply=tx;
  api('/shop',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify([{k:'msg',data:{list:list}}])}).then(function(){
      toast('已回复');$('rpTx').value='';loadMsg();
    }).catch(function(){toast('回复失败')});
});

function renderMusic(){
  $('pages').innerHTML='<div class="card"><div class="card-h">店铺背景音乐</div>'+
    '<div class="empty">网页版暂不支持播放本地音频<br>请在漫花鹿Pro APP 里设置</div></div>';
}

function renderSet(){
  var a=acc()||{name:'漫花鹿Pro用户',slug:SLUG};
  $('pages').innerHTML='<div class="card"><div class="card-h">账号</div>'+
    '<div class="prow"><span class="k">网页版账号</span><span class="v">'+esc(a.name)+' · 已登录</span></div>'+
    '<div class="prow"><span class="k">漫花鹿Pro 账号</span><span class="v">'+esc(a.name)+' <a class="link-a" id="toApp" href="#">打开 APP</a></span></div>'+
    '<div class="prow"><span class="k">账号同步</span><span class="v">已同步</span></div></div>'+
    '<div class="card"><div class="card-h">版本</div>'+
    '<div class="prow"><span class="k">当前网页版本</span><span class="v">v'+CUR.ver+'</span></div>'+
    '<div class="prow"><span class="k">检查更新</span><a class="link-a" id="chkUp" href="#">检查</a></div></div>'+
    '<div class="card"><div class="card-h">其他</div>'+
    '<div class="prow"><span class="k">退出登录</span><a class="link-a" id="logout" href="#">退出</a></div></div>';
  $('toApp').onclick=function(e){e.preventDefault();toast('请打开手机上的漫花鹿Pro APP')};
  $('chkUp').onclick=function(e){e.preventDefault();checkUpdate(true)};
  $('logout').onclick=function(e){e.preventDefault();localStorage.removeItem('mhl_web_acc');location.reload()};
}

/* ============ 版本同步 ============ */
function checkUpdate(manual){
  api('/shop?select=data&k=eq.app').then(function(rows){
    var d=(rows&&rows[0]&&rows[0].data)||{};
    if(d.ver)CUR.ver=d.ver;
    if(d.apk)CUR.apk=d.apk;
    if(d.note)CUR.note=d.note;
    $('pgVer').textContent='v'+CUR.ver;
    var seen=localStorage.getItem('mhl_web_ver')||'';
    localStorage.setItem('mhl_web_ver',CUR.ver);
    if(manual&&seen===CUR.ver){toast('已是最新版本 v'+CUR.ver);return}
    if(seen&&seen!==CUR.ver){
      $('updV').textContent='最新版本 '+CUR.ver+'（你当前是 '+seen+'）';
      $('updT').textContent=CUR.note||'网页版已同步到最新版本，刷新后即为最新内容。';
      $('updDl').href=CUR.apk;
      $('upd').classList.add('on');
    }
  }).catch(function(){if(manual)toast('检查更新失败')});
}
$('updGo').onclick=function(){$('upd').classList.remove('on');location.reload()};

/* 启动 */
var a=acc();
if(a&&a.name){enterApp(a.name)}
</script>
</body>
</html>
