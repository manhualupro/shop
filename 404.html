<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漫花鹿Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:#2b2b2b;min-height:100vh;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hero.custom{width:100vw;margin-left:calc(50% - 50vw)}
.main{width:100vw;margin-left:calc(50% - 50vw)}
.hero{position:relative;padding:14px 16px 44px;background:linear-gradient(160deg,#5aa7ff 0%,#3f8cff 45%,#2f6df6 100%);overflow:hidden;background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:#fff;border-radius:26px 26px 0 0}
.hero.custom{background:#fff!important;position:relative;padding-top:0;padding-bottom:6px;overflow:visible}
.hero.custom::before{display:none}
.hero.custom::after{content:"";position:absolute;left:8px;right:8px;top:0;bottom:0;height:auto;background:#fff;margin-top:-46px;box-shadow:0 2px 10px rgba(40,50,80,.08);border-radius:18px 18px 0 0;z-index:1}
.hero.custom>*{position:relative;z-index:2}
.hero.custom .nm{color:#1f1f22;text-shadow:none}
.hero.custom .cnt{color:#6b7280}
.hero.custom .order{background:#f4f5f8;color:#444}
.hero.custom .notice{background:transparent;border:0;color:#3a3f4a;padding:0}
.hero.custom .tag{background:#fff0f5;color:#ff5f8f}
.notice{padding:8px 11px;border-radius:10px;font-size:12.5px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3)}
.tools{display:flex;justify-content:flex-end;gap:8px;position:relative;z-index:2}
.ic{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ic svg{width:17px;height:17px}
.order{display:flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:0;background:rgba(20,60,150,.35);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.order svg{width:15px;height:15px}
.idrow{display:flex;gap:12px;align-items:flex-start;margin-top:10px;position:relative;z-index:2}
.avatar{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.85);overflow:hidden;background:#fff;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#3f8cff;font-size:22px}
.avatar img{width:100%;height:100%;object-fit:cover}
.idt{min-width:0;padding-top:2px}
.nm{font-size:21px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(20,70,170,.25)}
.tag{display:inline-block;margin-top:7px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#3f8cff;font-size:12px;font-weight:700}
.cnt{margin-top:6px;color:rgba(255,255,255,.9);font-size:13px}
.notice{margin-top:12px;color:#fff;font-size:13.5px;line-height:1.75;white-space:pre-wrap;position:relative;z-index:2}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;position:relative;z-index:2}
.links a{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.95);color:#2f6df6;font-size:13px;font-weight:600;text-decoration:none;box-shadow:0 2px 8px rgba(30,60,120,.1)}
.crow{display:flex;justify-content:flex-end;margin-top:10px;position:relative;z-index:2}
.cbtn{display:flex;align-items:center;gap:7px;height:38px;padding:0 18px;border-radius:999px;border:0;background:#fff;color:#2b2b2b;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(20,70,170,.18)}

.hero.custom .idrow{flex-direction:column;align-items:flex-start;text-align:left;gap:6px}
.hero.custom .avatar{width:88px;height:88px;font-size:26px;margin-top:-34px;border:3px solid #fff;box-shadow:0 6px 16px rgba(20,30,60,.12)}
.hero.custom .idt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-top:0}
.hero.custom .nm{color:#22262f;font-size:22px;text-shadow:none}
.certs{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}
.certs img{height:20px;width:auto;display:block}
.hero.custom .cnt{color:#767b85}
.hero.custom .crow{position:absolute;right:16px;top:86px;justify-content:flex-end}
.hero.custom .tools{position:absolute;top:10px;right:16px;z-index:3}
.heroCover{position:static;display:block;width:100%;height:200px;background-size:cover;background-position:center;background-repeat:no-repeat;display:none}
.hero.custom .heroCover{display:block}
.hero.custom .cnt{position:absolute;right:16px;top:18px;text-align:right;margin:0}
.hero.custom .cnt b{display:block;font-size:20px;text-align:right;font-weight:600;color:#1f1f22}
.hero.custom .cnt span{display:block;font-size:18px;font-weight:800;color:#1f1f22}
.main{flex:1;padding:2px 16px 110px;position:relative;z-index:3;background:#fff}
.sec{position:relative;display:inline-block;margin:6px 0 14px;font-size:15px;font-weight:800;color:#2f6df6}
.sec::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;border-radius:2px;background:#2f6df6}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.chip{position:relative;display:flex;align-items:center;gap:8px;min-width:0;flex:0 0 auto;padding:9px 14px;border-radius:14px;
  background:#f2f4f8;color:#22262f;cursor:pointer;border:0;text-align:left;font-family:inherit}
.chip.on{background:#e8f1ff}
.chip .ci{width:26px;height:26px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:0 0 auto}
.chip .ci img{width:100%;height:100%;object-fit:cover}
.chip b{display:block;font-size:14px;font-weight:700;white-space:nowrap}
.chip i{display:block;font-style:normal;font-size:12px;color:#7a8394;margin-top:3px}
.chip .ck{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:14px}
.sec2{font-size:14px;font-weight:800;color:#3a3a3a;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#fff;border-radius:6px;overflow:hidden;cursor:pointer;box-shadow:0 4px 14px rgba(40,80,150,.10);border:1px solid #eef2f8}
.card .th{width:100%;aspect-ratio:1/1;background:#eef3fb;display:flex;align-items:center;justify-content:center;color:#9fb4d4;font-size:12px}
.card .th img{width:100%;height:100%;object-fit:cover}
.card .cb{padding:8px 10px 10px}
.card .pn{font-size:13px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .prow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:7px}
.price{font-size:13px;font-weight:800;color:#ff6a3d}
.stock{font-size:12px;font-weight:600}
.stock.ok{color:#3f8cff}.stock.mid{color:#3f8cff}.stock.low{color:#f0a020}.stock.out{color:#ff4d4f}
.end{text-align:center;color:#b9b9b9;font-size:13px;padding:18px 0 4px}
.power{text-align:center;color:#c2c8d4;font-size:11px;padding:8px 0 18px}
.sec b.rem{font-weight:800}
.empty{padding:20px;text-align:center;color:#9aa7bd;font-size:13px}
/* 直角 + 黑字 + 满宽 */
.chip{border-radius:0!important;background:#f2f4f8;color:#222!important}
.chip.on{background:#e8f1ff;color:#222!important}
.links a{border-radius:0!important;color:#222!important;background:#fff!important;border:1px solid #e6e6e6!important}
.card{border-radius:0!important}
.cbtn{border-radius:0!important;color:#222!important}
.cbtn svg{stroke:#222!important}
.paybtn{border-radius:0!important;color:#222!important}
.paybtn.on{color:#222!important}
.sheet{background:#fff!important;border-radius:0!important}
.sheet .btn{border-radius:0!important}
.sheet .btn.ghost{border-radius:0!important}
#buyContact{border-radius:0!important;color:#222!important}
.hero.custom .heroCover{margin-left:-16px!important;margin-right:-16px!important;width:calc(100% + 32px)!important}
.cnt{display:flex;justify-content:flex-end;gap:18px;text-align:center}
.cnt .cn b{display:block;font-size:18px!important;font-weight:700!important;line-height:1.15;text-align:center!important}
.cnt .cn span{display:block;font-size:12px!important;font-weight:600!important;margin-top:2px;text-align:center!important}
.hero.custom .cnt{position:absolute;right:16px;top:18px}
.hero.custom .crow{position:absolute!important;right:0!important;top:78px!important;margin:0!important}
.hero.custom .crow .cbtn{height:30px;padding:0 12px;font-size:12px}

.mask{position:fixed;inset:0;background:rgba(20,30,50,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.mask.on{display:flex}
.sheet{width:100%;max-width:560px;background:#f7f8fb;border-radius:20px 20px 0 0;padding:18px 18px 26px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .t{font-size:16px;font-weight:800;margin-bottom:4px}
.sheet .p{font-size:22px;font-weight:800;color:#ff6a3d;margin:8px 0 14px}
.pay{display:flex;gap:10px;margin-bottom:14px}
.paybtn{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid #dfe6f2;background:#fff;font-size:14px;font-weight:700;color:#4a4a4a;cursor:pointer}
.pico{width:26px;height:26px;border-radius:50%;display:block}
.paybtn.on{border-color:#3f8cff;background:#eff5ff;color:#2f6df6}
.paybtn.off{opacity:.4;text-decoration:line-through}
.btn{width:100%;min-height:48px;border:0;border-radius:14px;background:#3f8cff;color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 10px 22px rgba(63,140,255,.3)}
.btn.pink{background:linear-gradient(135deg,#ff8fb2,#ff5384);box-shadow:0 10px 22px rgba(255,95,143,.3)}
.btn.ghost{background:#fff;color:#5a6b85;box-shadow:inset 0 0 0 1px #dfe6f2}
.keybox{margin:10px 0;padding:12px;border-radius:12px;background:#fff;border:1px dashed #b9d0f5;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6;white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.keybox.wrap{white-space:normal;word-break:break-all;max-height:3.3em;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;border-bottom:1px solid #eef1f6;font-size:14px;cursor:pointer}
.row:last-child{border-bottom:0}
.row i{font-style:normal;color:#8b97ab;font-size:13px}
.ball{position:fixed;left:14px;bottom:70px;width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(140deg,#5aa7ff,#2f6df6);box-shadow:0 10px 24px rgba(47,109,246,.35);display:none;align-items:center;justify-content:center;color:#fff;z-index:40;cursor:pointer;font-size:20px}
.player{position:fixed;left:0;bottom:70px;width:82%;max-width:368px;border-radius:0 14px 14px 0;background:rgba(255,255,255,.97);box-shadow:0 12px 28px rgba(30,50,90,.18);z-index:41;padding:10px;display:none}
.player.on{display:block}
.player .hh{display:flex;align-items:center;gap:10px}
.player .cover{width:52px;height:52px;border-radius:10px;overflow:hidden;background:#eff4ff;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.player .cover img{width:100%;height:100%;object-fit:cover}
.player .m{flex:1;min-width:0}
.player .m b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .m i{font-size:11px;color:#8b97ab;font-style:normal;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .listen{width:30px;height:30px;border:0;border-radius:8px;background:rgba(47,109,246,.1);color:#2f6df6;font-size:14px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.player .x{border:0;background:transparent;font-size:16px;color:#a2adbd;cursor:pointer;padding:4px 6px}
.player .ctl{display:flex;align-items:center;gap:8px;margin-top:10px}
.nat-audio{width:100%;height:54px;margin-top:10px;border-radius:10px}
.player .pl{width:34px;height:34px;border-radius:50%;border:0;background:#3f8cff;color:#fff;font-size:13px;cursor:pointer;flex:0 0 auto}
.player .bar{flex:1;height:5px;border-radius:3px;background:rgba(120,140,170,.2);position:relative;cursor:pointer;min-width:60px}
.player .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:#3f8cff}
.player .spd{border:0;background:rgba(63,140,255,.12);color:#2f6df6;font-size:11px;font-weight:700;padding:4px 7px;border-radius:8px;cursor:pointer;flex:0 0 auto}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,30,50,.86);color:#fff;font-size:13px;padding:11px 18px;border-radius:12px;z-index:60;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}

/* ---------- 蓝色风格2（梦言云卡风） ---------- */
body.b2body{background:#f4f6fa}
.b2{padding:10px 10px 70px;font-size:14px;color:#22262f}
.b2-hd{background:linear-gradient(135deg,#2f6df6,#4b90ff);border-radius:10px;padding:14px 12px;display:flex;align-items:flex-start;gap:10px;box-shadow:0 6px 18px rgba(47,109,246,.25)}
.b2-logo{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.b2-logo svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.6}
.b2-hi{flex:1 1 auto;min-width:0;color:#fff}
.b2-nm{font-size:17px;font-weight:800;line-height:1.2;margin-bottom:6px}
.b2-meta{font-size:12px;color:rgba(255,255,255,.9);margin-top:3px}
.b2-qq{background:#fff;color:#2f6df6;border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;flex:0 0 auto;cursor:pointer}
.b2-sec{display:flex;align-items:center;gap:6px;margin:14px 2px 8px;font-size:15px;font-weight:800}
.b2-sec i{width:3px;height:14px;border-radius:2px;background:#2f6df6;display:block}
.b2-in{width:100%;height:42px;border:1px solid #e4e9f3;border-radius:8px;background:#fff;padding:0 12px;font-size:14px;outline:none;color:#22262f}
.b2-btn{width:100%;height:42px;border:0;border-radius:8px;background:#2f6df6;color:#fff;font-size:14px;font-weight:700;margin-top:8px;cursor:pointer}
.b2-cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b2-cat{position:relative;background:#fff;border:1px solid #eceff6;border-radius:8px;padding:10px 12px;cursor:pointer;min-height:56px}
.b2-cat b{display:block;font-size:13px;font-weight:700;line-height:1.35}
.b2-cat small{display:block;font-size:11.5px;color:#8b95a7;margin-top:6px}
.b2-cat.on{background:#2f6df6;border-color:#2f6df6}
.b2-cat.on b{color:#fff}
.b2-cat.on small{color:rgba(255,255,255,.85)}
.b2-cat.on::after{content:"";position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;border-width:0 0 20px 20px;border-color:transparent transparent #fff transparent;border-bottom-right-radius:8px}
.b2-cat.on::before{content:"✓";position:absolute;right:3px;bottom:1px;font-size:11px;color:#2f6df6;z-index:2;font-weight:800}
.b2-goods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b2-good{background:#fff;border:1px solid #eceff6;border-radius:8px;padding:10px 11px;cursor:pointer;position:relative;display:block;min-height:66px}
.b2-good .gt{min-width:0}
.b2-good .gn{font-size:13px;font-weight:700;line-height:1.35}
.b2-good .gp{font-size:13px;color:#2f6df6;font-weight:800;margin-top:5px}
.b2-good .gs{font-size:11.5px;color:#8b95a7;margin-top:3px}
.b2-good.on{border-color:#2f6df6;box-shadow:0 0 0 1px #2f6df6 inset}
.b2-good.on::before{content:"✓";position:absolute;right:4px;top:4px;width:18px;height:18px;border-radius:4px;background:#2f6df6;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.b2-ck{margin-top:6px;background:#fff;border-radius:10px;padding:4px 12px 12px}
.b2-r{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #f1f3f8;font-size:13px}
.b2-r:last-of-type{border-bottom:0}
.b2-r .lab{color:#22262f;font-weight:600}
.b2-r .lab.req::before{content:"*";color:#e2457a;margin-right:3px}
.b2-step{display:flex;align-items:center;border:1px solid #e4e9f3;border-radius:6px;overflow:hidden}
.b2-step button{width:34px;height:30px;border:0;background:#f6f8fc;color:#4a5566;font-size:16px;cursor:pointer}
.b2-step input{width:44px;height:30px;border:0;text-align:center;font-size:13px;outline:none}
.b2-input{width:100%;height:38px;border:1px solid #e4e9f3;border-radius:6px;padding:0 10px;font-size:13px;outline:none;margin:6px 0 2px}
.b2-note{font-size:11.5px;color:#9aa4b6;margin-top:2px}
.b2-sw{width:44px;height:24px;border-radius:999px;background:#e6eaf2;position:relative;transition:.2s}
.b2-sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.b2-sw.on{background:#2f6df6}
.b2-sw.on i{left:22px}
.b2-pays{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.b2-pay{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:48px;border:1px solid #e4e9f3;border-radius:8px;background:#fff;font-size:13px;font-weight:700;color:#5a6478;cursor:pointer}
.b2-pay img{width:20px;height:20px;display:block}
.b2-pay.on{border-color:#2f6df6;color:#2f6df6;background:#f2f6ff}
.b2-pay.on::before{content:"✓";position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:3px;background:#2f6df6;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.b2-cp{text-align:center;font-size:11.5px;color:#a3adbd;margin:16px 0 6px}
.b2-bar{position:fixed;left:0;right:0;bottom:0;padding:8px 10px;background:rgba(244,246,250,.94);backdrop-filter:blur(8px);border-top:1px solid #e8ecf4}
.b2-bar button{width:100%;height:46px;border:0;border-radius:8px;background:#2f6df6;color:#fff;font-size:15px;font-weight:800;cursor:pointer}


.nfound{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#f6f7fb;text-align:center;z-index:9999}
.nfound .nficon{width:56px;height:56px;border-radius:50%;background:#fff;color:#c0c4cc;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(17,24,39,.08);margin-bottom:18px}
.nfound .nft{font-size:19px;font-weight:700;color:#1f2430}
.nfound .nfd{margin-top:8px;font-size:13px;color:#8b90a0;line-height:1.6;max-width:280px}
.nfound .nfp{margin-top:14px;font-size:12px;color:#a3a8b8;font-family:ui-monospace,Menlo,monospace;word-break:break-all}

/* 客服聊天 */
.chatfab{position:fixed;right:16px;bottom:96px;width:50px;height:50px;border-radius:50%;background:#2f6df6;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(47,109,246,.35);z-index:9000}
.chatfab svg{width:24px;height:24px}
.cmask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:9400;display:none}
.cmask.on{display:block}
.cpanel{position:absolute;left:0;right:0;bottom:0;height:72%;background:#fff;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.cpanel .chd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #eef0f5}
.cpanel .chd b{font-size:15px}
.cpanel .chd .cx{width:26px;height:26px;border:0;background:#f2f4f8;border-radius:50%;color:#6b7280;font-size:15px}
.cbody{flex:1 1 auto;overflow-y:auto;padding:14px 14px 6px;background:#f7f8fc}

function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on')},1700)}
function copyText(t){
  try{navigator.clipboard.writeText(t);toast('已复制');return}catch(e){}
  var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制')}catch(x){toast('复制失败，请长按选择')}

var curCat=null;


/* ===== 客服聊天（云端同步） ===== */
var CHAT_API=SB_URL.replace('/shop','/chat');
var searchQ='';
var VID=(function(){var k='mhl_vid';var v=localStorage.getItem(k);if(!v){v='v'+Date.now().toString(36)+Math.floor(Math.random()*900+100);localStorage.setItem(k,v)}return v})();
function chatEl(){return document.getElementById('cmask')}
function openChat(){
  var m=chatEl();if(!m)return;
  m.classList.add('on');loadChat();
}
function closeChat(){var m=chatEl();if(m)m.classList.remove('on')}
function fmtTm(t){var d=new Date(t||Date.now());var hh=('0'+d.getHours()).slice(-2),mm=('0'+d.getMinutes()).slice(-2);return hh+':'+mm}
function renderChat(rows){
  var box=document.getElementById('cbody');if(!box)return;
  if(!rows||!rows.length){box.innerHTML='<div class="crhint">有问题直接说，店家看到会回你</div>';return}
  box.innerHTML=rows.map(function(r){
    var side=r.who==='s'?'s':'b';
    return '<div class="cmsg '+side+'"><div><div class="bub">'+esc(r.txt).replace(/\n/g,'<br>')+'</div>'+
      '<div class="tm" style="text-align:'+(side==='s'?'right':'left')+'">'+fmtTm(r.ts)+'</div></div></div>';
  }).join('');
  box.scrollTop=box.scrollHeight;
}
var chatTimer=null;
function loadChat(){
  if(!SID)return;
  clearTimeout(chatTimer);
  fetch(CHAT_API+'?shop=eq.'+encodeURIComponent(SID)+'&thread=eq.'+encodeURIComponent(VID)+'&order=ts.asc&limit=200',
    {headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}})
    .then(function(r){return r.json()})
    .then(function(rows){renderChat(rows);chatTimer=setTimeout(loadChat,5000)})
    .catch(function(){chatTimer=setTimeout(loadChat,8000)});
}
function sendChat(){
  var inp=document.getElementById('cin');if(!inp)return;
  var v=inp.value.trim();if(!v)return;
  inp.value='';
  fetch(CHAT_API,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify([{shop:SID,thread:VID,who:'b',txt:v}])})
    .then(function(){loadChat()}).catch(function(){toast('发送失败，检查网络')});
}
function mountChat(){
  if(!SID||!S||!S.name)return;
  var f=document.createElement('button');f.className='chatfab';f.id='chatfab';
  f.innerHTML='<svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.4 8.4 0 0 1-8.4 8.4 8.6 8.6 0 0 1-3.9-.9L3 21l1.9-5.7a8.4 8.4 0 1 1 16.1-3.8z" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>';
  f.onclick=openChat;document.body.appendChild(f);
  var m=document.createElement('div');m.className='cmask';m.id='cmask';
  m.innerHTML='<div class="cpanel"><div class="chd"><b>联系店家</b><button class="cx" id="ccx">&#10005;</button></div>'+
    '<div class="cbody" id="cbody"></div>'+
    '<div class="cfoot"><input id="cin" placeholder="说点什么…" maxlength="500"><button id="csend">发送</button></div></div>';
  document.body.appendChild(m);
  m.onclick=function(e){if(e.target===m)closeChat()};
  document.getElementById('ccx').onclick=closeChat;
  document.getElementById('csend').onclick=sendChat;
  document.getElementById('cin').addEventListener('keydown',function(e){if(e.key==='Enter')sendChat()});
}

function startShop(){
  if(!S.name){
    document.body.classList.remove('b2body');
    var w=document.querySelector('.wrap');if(w)w.parentNode.removeChild(w);
    var d=document.createElement('div');
    d.className='nfound';
    d.innerHTML='<div class="nficon">!</div><div class="nft">此店铺链接不存在</div>'+
      '<div class="nfd">请检查链接里的后缀是否写错，或找店家要一个新的链接</div>'+
      (SID?'<div class="nfp">当前后缀：'+esc(SID)+'</div>':'');
    document.body.appendChild(d);
    return;
     }
  boot();
}
pullShop(startShop);

function buildBlue2(){
  document.body.classList.add('b2body');
  var wrapEl=document.querySelector('.wrap');if(wrapEl)wrapEl.parentNode.removeChild(wrapEl);
  var c=S.contact||{};
  var st={cat:(S.cats&&S.cats[0])?S.cats[0].id:'',prod:null,qty:1,kw:'',sms:false,mail:false,
    pay:((S.payCfg&&S.payCfg.wx&&!S.payCfg.ali)?'wx':'ali')};
  function cats(){return S.cats||[]}
  function prods(){
    var list=(S.prods||[]).filter(function(p){return p.catId===st.cat});
    if(st.kw)list=list.filter(function(p){return (p.name||'').toLowerCase().indexOf(st.kw.toLowerCase())>=0});
    return list;
  }
  function meta(k,v){return v?'<div class="b2-meta">'+esc(k)+'：'+esc(v)+'</div>':''}
  var box=document.createElement('div');box.className='b2';
  document.body.insertBefore(box,document.body.firstChild);

  function draw(){
    var catHtml=cats().map(function(c){
      var n=(S.prods||[]).filter(function(p){return p.catId===c.id}).length;
      return '<div class="b2-cat'+(c.id===st.cat?' on':'')+'" data-c="'+esc(c.id)+'">'+

    }).join('')||'<div class="b2-note">还没有分类</div>';

    var goodHtml=prods().map(function(p){
      var left=(p.keys||[]).length;
      var price=Number(p.price)>0?('¥'+yuan(p.price)):'免费';
      var stock=left<=0?'缺货':(left>100?'库存充足':('剩余 '+left+' 张'));
      return '<div class="b2-good'+(st.prod&&st.prod.id===p.id?' on':'')+'" data-p="'+esc(p.id)+'">'+
        '<div class="gt"><div class="gn">'+esc(p.name)+'</div>'+
        '<div class="gp">'+price+'</div><div class="gs">'+stock+'</div></div></div>';
    }).join('')||'<div class="b2-note">这个分类还没有商品</div>';

    if(st.prod){
      var total=(Number(st.prod.price)||0)*st.qty;
      ck='<div class="b2-ck">'+
        '<div class="b2-r"><span class="lab req">购买数量</span>'+
          '<div class="b2-step"><button data-q="-">−</button><input id="b2q" value="'+st.qty+'" readonly><button data-q="+">+</button></div></div>'+
        '<div class="b2-r" style="display:block"><div class="lab req">联系方式</div>'+
          '<input class="b2-input" id="b2contact" placeholder="[必填]推荐填写QQ号或手机号！">'+
          '<div class="b2-note">联系方式特别重要，可用来查询订单</div></div>'+
        '<div class="b2-r"><span class="lab">短信提醒</span><div class="b2-sw'+(st.sms?' on':'')+'" data-s="sms"><i></i></div></div>'+
        '<div class="b2-r"><span class="lab">邮箱提醒</span><div class="b2-sw'+(st.mail?' on':'')+'" data-s="mail"><i></i></div></div>'+
        '<div class="b2-r" style="display:block"><div class="lab">支付方式</div>'+
          '<div class="b2-pays">'+
            '<div class="b2-pay'+(st.pay==='wx'?' on':'')+'" data-pay="wx"><img src="'+WX_ICON+'" alt="">微信支付</div>'+
            '<div class="b2-pay'+(st.pay==='ali'?' on':'')+'" data-pay="ali"><img src="'+ALI_ICON+'" alt="">支付宝</div>'+
          '</div></div>'+
        '<div class="b2-cp">Copyright © 2018-2026 '+esc(S.name)+' 版权所有</div>'+
      '</div>';
    }

    box.innerHTML=
      '<div class="b2-hd"><div class="b2-logo"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1.2 10.2a1.5 1.5 0 01-1.5 1.3H6.7a1.5 1.5 0 01-1.5-1.3L4 9z"/><path d="M8.5 9V6.6a3.5 3.5 0 017 0V9"/></svg></div>'+
        '<div class="b2-hi"><div class="b2-nm">'+esc(S.name)+'</div>'+
          meta('客服QQ',c.qq)+'<div class="b2-meta">✓ 商家已认证</div>'+
          '<div class="b2-meta">🕗 开店时间：'+esc(S.created||S.time||'—')+'</div></div>'+
        '<button class="b2-qq" id="b2order">查询订单</button></div>'+
      '<div class="b2-sec"><i></i>商品搜索</div>'+
      '<input class="b2-in" id="b2kw" placeholder="输入关键词搜索商品" value="'+esc(st.kw)+'">'+
      '<button class="b2-btn" id="b2search">🔍 商品查询</button>'+
      '<div class="b2-sec"><i></i>选择分类</div>'+
      '<div class="b2-cats">'+catHtml+'</div>'+
      '<div class="b2-sec"><i></i>选择商品</div>'+

      var g=e.target.closest('.b2-good');
      if(g){var id=g.getAttribute('data-p');

  function pickChan(cfg,pref){
    if(pref==='wx'&&cfg.wx)return 'wx';
    if(pref==='ali'&&cfg.ali)return 'ali';
    return cfg.wx?'wx':'ali';
  }
  function demo(p){
    var left=(S.prods||[]).reduce(function(a,x){return a+(x.keys||[]).length},0);
    var key=null;
    (S.prods||[]).forEach(function(x){if(!key&&x.name===p.name&&(x.keys||[]).length)key=takeKey(x)});
    $('mask').classList.add('on');
    $('sheet').innerHTML='<div class="t">支付成功</div>'+
      '<div style="font-size:12px;color:#8b97ab;margin:6px 0 12px">演示支付 · ¥'+yuan(p.price)+'（商家未开通真实支付，不会真实扣款）</div>'+
      '<div style="background:#fff;border-radius:12px;padding:12px;margin-bottom:12px"><div style="font-size:12px;color:#8b97ab">商品</div>'+
      '<div style="font-size:14px;font-weight:700;margin-top:4px">'+esc(p.name)+'</div></div>'+

      (key?'<button class="btn" id="cpKey">复制卡密</button>':'')+

    if(key)$('cpKey').onclick=function(){copyText(key)};
    $('closeSheet').onclick=function(){$('mask').classList.remove('on')};

function renderChips(){
  var h='<button class="chip'+(curCat==='__all'?' on':'')+'" data-c="__all"><span class="cx"><b>全部</b></span></button>';
  (S.cats||[]).forEach(function(c){
    var n=(S.prods||[]).filter(function(p){return p.catId===c.id}).length;
    var on=c.id===curCat;
    h+='<button class="chip'+(on?' on':'')+'" data-c="'+esc(c.id)+'">'+
      (c.thumb?('<span class="ci"><img src="'+esc(c.thumb)+'" alt=""></span>'):'')+
      '<span class="cx"><b>'+esc(c.name)+'</b>'+(S.style==='blue'?('<i>包含'+n+'种商品</i>'):'')+'</span>'+
      '</button>';
  });
  if(!h)h='<div class="empty">还没有分类</div>';
  $('chips').innerHTML=h;
  $('chips').onclick=function(e){
    var b=e.target.closest('.chip');if(!b)return;
    curCat=b.getAttribute('data-c');renderChips();
  };
  renderGoods();
}
function renderGoods(){
  var list=(S.prods||[]).filter(function(p){
    if(searchQ)return (p.name||'').toLowerCase().indexOf(searchQ.toLowerCase())>=0;
    if(curCat==='__all')return true;
    return p.catId===curCat;
  });
  if(!list.length){$('goods').innerHTML='<div class="empty">'+(searchQ?'没有找到相关商品':'这个分类还没有商品')+'</div>';return}
  var h='<div class="grid">';
  list.forEach(function(p){
    var left=(p.keys||[]).length;
    var cls=left<=0?'out':(left>=60?'ok':'low');
    var label=left<=0?'缺货':(left>100?'库存充足':(left>=60?'库存一般':'剩余 '+left+' 张'));
    var price=Number(p.price)>0?('¥'+yuan(p.price)):'免费';
    h+='<div class="card" data-p="'+esc(p.id)+'">'+
       (p.thumb?('<div class="th"><img src="'+esc(p.thumb)+'" alt=""></div>'):'')+
       '<div class="cb"><div class="pn">'+esc(p.name)+'</div>'+
       '<div class="prow"><span class="price">'+price+'</span><span class="stock '+cls+'">'+label+'</span></div></div></div>';
  });
  h+='</div>';
  $('goods').innerHTML=h;
  $('goods').onclick=function(e){
    var g=e.target.closest('.card');if(!g)return;
    var p=(S.prods||[]).filter(function(x){return x.id===g.getAttribute('data-p')})[0];
    if(p)buySheet(p);
  };
}

function mhlSold(){try{return JSON.parse(localStorage.getItem('mhl_sold')||'{}')}catch(e){return {}}}
function takeKey(prod){
  if(!prod)return '';
  var all=prod.keys||[];if(!all.length)return '';
  var store=mhlSold();var used=store[prod.id]||[];
  var k=all.filter(function(x){return used.indexOf(x)<0})[0];
  if(!k)k=all[0];
  used.push(k);store[prod.id]=used;
  try{localStorage.setItem('mhl_sold',JSON.stringify(store))}catch(e){}
  return k;
}
function usedLeft(p){return (p.keys||[]).length}
function buyerPay(p,chan){
  var cfg=(SHOP&&SHOP.payCfg)||null;
  if(!cfg||!cfg.on||(!cfg.wx&&!cfg.ali))return false;
  var chans=[];
  if(chan==='wx'&&cfg.wx)chans.push({k:'wx',n:'微信',qr:cfg.wx});
  else if(chan==='ali'&&cfg.ali)chans.push({k:'ali',n:'支付宝',qr:cfg.ali});
  else{if(cfg.wx)chans.push({k:'wx',n:'微信',qr:cfg.wx});if(cfg.ali)chans.push({k:'ali',n:'支付宝',qr:cfg.ali});}
  var no='MH'+Date.now().toString().slice(-8)+Math.floor(Math.random()*90+10);
  var t0=Date.now();
  var cur=chans[0].k;
  var timer=null;
  function leftTxt(){
    var left=t0+15*60*1000-Date.now();
    if(left<=0)return '已超时，请重新下单';
    var m=Math.floor(left/60000),s2=Math.floor((left%60000)/1000);
    return '剩余 '+m+':'+(s2<10?'0':'')+s2;
  }
  function stop(){if(timer){clearInterval(timer);timer=null}}
  function draw(fpaid){
    var c=chans.filter(function(x){return x.k===cur})[0]||chans[0];
    var h='<div class="t">收银台</div>'+
      '<div style="background:#fff;border-radius:14px;padding:14px;margin:10px 0;text-align:center">'+
      '<div style="font-size:13px;color:#8b97ab">'+esc(p.name)+'</div>'+
      '<div style="font-size:26px;font-weight:800;color:#ff5f8f;margin:4px 0">'+(Number(p.price)>0?('¥'+yuan(p.price)):'免费')+'</div>'+
      '<div style="font-size:12px;color:#8b97ab;font-family:monospace">订单号 '+no+'</div>'+
      chans.map(function(x){
        return '<div style="font-size:12px;color:#6b7a92;margin-top:10px">'+(chans.length>1?x.n+'收款码':'扫码付款')+'</div>'+
          '<img src="'+x.qr+'" style="width:210px;height:210px;object-fit:contain;background:#fff;border-radius:14px;display:block;margin:6px auto">';
      }).join('')+
      '<div id="bkCd" style="font-size:12px;font-weight:700;color:#ff5f8f">'+leftTxt()+'</div>'+
      '<div style="font-size:12px;color:#6b7a92;margin-top:8px;line-height:1.7">扫码付款，备注写订单号后两位</div>'+
      '</div>';
    h+='<div style="background:#fff;border-radius:14px;padding:14px;text-align:center;margin-bottom:12px">'+
      '<div style="font-weight:700;font-size:14px">付完点下面的按钮</div>'+
      '<div style="font-size:12px;color:#8b97ab;margin-top:4px">商家确认到账后会把卡密发给你</div></div>';
    h+='<button class="btn" id="bkPaid">我已付款</button>'+
      '<button class="btn ghost" style="margin-top:10px" id="bkClose">取消</button>';
    $('sheet').innerHTML=h;
    $('bkPaid').onclick=function(){
      stop();
      $('sheet').innerHTML='<div class="t">已提交付款</div>'+
        '<div style="background:#fff;border-radius:14px;padding:14px;margin:10px 0">'+
        '<div style="font-size:13px;color:#8b97ab">订单号</div>'+
        '<div style="font-family:monospace;font-size:15px;font-weight:700;margin-top:4px">'+no+'</div>'+
        '<div style="font-size:13px;color:#8b97ab;margin-top:10px">'+esc(p.name)+' · '+(Number(p.price)>0?('¥'+yuan(p.price)):'免费')+'</div></div>'+
        '<div style="font-size:13px;color:#6b7a92;line-height:1.8;margin-bottom:12px">把订单号发给商家，商家核对到账后就把卡密发你。</div>'+
        '<button class="btn ghost" id="bkDone">关闭</button>';
      $('bkDone').onclick=function(){$('mask').classList.remove('on')};
    };
    $('bkClose').onclick=function(){stop();$('mask').classList.remove('on')};
  }
  $('mask').classList.add('on');
  draw(false);
  stop();
  timer=setInterval(function(){
    var el=document.getElementById('bkCd');
    if(el)el.textContent=leftTxt();
  },1000);
  return true;
}
function buySheet(p){
  if(buyerPay(p))return;
  var pay=S.pay||{};
  var picks=[];if(pay.wechat===true)picks.push('wechat');if(pay.alipay===true)picks.push('alipay');
  var cur=picks.length?picks[0]:'';
  function draw(){
    var h='<div class="t">'+esc(p.name)+'</div><div class="p">'+(Number(p.price)>0?('¥'+yuan(p.price)):'免费')+'</div>';
    if(picks.length){
      h+='<div style="font-size:13px;color:#6b7a92;margin-bottom:8px">选择支付方式</div><div class="pay">';
      picks.forEach(function(m){
        h+='<button class="paybtn'+(cur===m?' on':'')+'" data-m="'+m+'"><img class="pico" src="'+(m==='wechat'?WX_ICON:ALI_ICON)+'" alt="">'+(m==='wechat'?'微信支付':'支付宝')+'</button>';
      });
      for(var pi=picks.length;pi<2;pi++){ h+='<span class="paybtn" style="visibility:hidden"></span>' }
      h+='</div>';
    }else{
      h+='<div style="font-size:13px;color:#8b97ab;margin:4px 0 12px">商家暂未开通在线支付，请联系商家</div>';
    }
    h+='<div style="font-size:13px;color:#6b7a92;margin:0 0 8px">联系方式（6位数字）</div>';
    h+='<input id="buyContact" inputmode="numeric" maxlength="6" placeholder="请输入6位联系方式" style="width:100%;box-sizing:border-box;border-radius:0;border:1px solid #dfe6f2;background:#fff;color:#222;padding:12px 14px;font-size:14px;margin-bottom:14px">';
    h+='<button class="btn'+(S.style==='blue'?' ':' pink')+'" id="payNow">立即支付</button>';
    $('sheet').innerHTML=h;
    $('sheet').querySelectorAll('.paybtn').forEach(function(b){
      b.onclick=function(){
        var m=b.getAttribute('data-m');
        if(picks.indexOf(m)<0){toast('商家没有开通这个支付方式');return}
        cur=m;draw();
      };
    });
    var ci=document.getElementById('buyContact');
    if(ci){
      ci.addEventListener('input',function(){ci.value=(ci.value||'').replace(/\D/g,'').slice(0,6)});
      try{ci.value=S.contactVal||''}catch(e){}
    }
    $('payNow').onclick=function(){
      var v=ci?(ci.value||'').replace(/\D/g,''):'';
      if(!/^\d{6}$/.test(v)){toast('请输入联系方式');try{ci.focus()}catch(e){};return}
      S.contactVal=v;
      if(!cur){toast('商家暂未开通在线支付，请联系商家');return}
      done(p,cur);
    };
  }
  function done(prod,method){
    var left=usedLeft(prod);
    if(left<=0){toast('无法购买，卡密没货了');return}
    var key=takeKey(prod)||'暂无卡密';
    var no='MH'+Date.now().toString().slice(-8)+Math.floor(Math.random()*90+10);
    $('sheet').innerHTML='<div class="t">支付成功</div>'+
      '<div style="font-size:12px;color:#8b97ab;margin:6px 0 12px">订单号 '+no+' · '+(method==='wechat'?'微信支付':'支付宝')+(S.contactVal?(' · '+esc(S.contactVal)):'')+'</div>'+
      '<div style="background:#fff;border-radius:12px;padding:12px;margin-bottom:12px"><div style="font-size:12px;color:#8b97ab">商品</div>'+
      '<div style="font-size:14px;font-weight:700;margin-top:4px">'+esc(prod.name)+'</div></div>'+
      '<div style="font-size:13px;color:#6b7a92;margin-bottom:6px">你的卡密</div>'+
      '<div class="keybox'+(S.style==='blue'?' wrap':'')+'" id="theKey">'+esc(key)+'</div>'+
      '<button class="btn'+(S.style==='blue'?' ':' pink')+'" id="cpKey">复制卡密</button>'+
      '<button class="btn ghost" style="margin-top:10px" id="closeSheet">关闭</button>';
    $('cpKey').onclick=function(){copyText(key)};
    $('closeSheet').onclick=function(){$('mask').classList.remove('on')};
  }
  $('mask').classList.add('on');draw();
}
if($('lookupBtn'))$('lookupBtn').onclick=function(){toast('请凭订单号联系商家查询，或在 App 内查看订单')};
if($('searchBtn'))$('searchBtn').onclick=function(){
  if(searchQ){ searchQ=''; renderChips(); toast('已回到全部商品'); return }
  $('sheet').innerHTML='<div class="t">搜索商品</div>'+
    '<input id="qIn" placeholder="输入商品名称" style="width:100%;box-sizing:border-box;border-radius:14px;border:1px solid #dfe6f2;background:#fff;padding:12px 14px;font-size:14px;margin:10px 0 14px">'+
    '<button class="btn pink" id="qGo">搜索</button>'+
    '<button class="btn ghost" id="qBack" style="margin-top:10px">返回全部商品</button>';
  $('mask').classList.add('on');
  $('qGo').onclick=function(){ searchQ=((document.getElementById('qIn').value)||'').trim(); $('mask').classList.remove('on'); renderChips(); };
  $('qBack').onclick=function(){ searchQ=''; $('mask').classList.remove('on'); renderChips(); };
};
$('mask').onclick=function(e){if(e.target===$('mask'))$('mask').classList.remove('on')};
function setupMusic(){
  var m=S.music;if(!m||(!m.url&&!m.id))return;
  var audio=$('mAudio');
  var urls=[];if(m.id)urls.push('https://music.163.com/song/media/outer/url?id='+m.id+'.mp3');if(m.url)urls.push(m.url);
  var idx=0;
  function next(){
    if(idx>=urls.length){toast('这首歌取不到播放地址');return}
    audio.src=urls[idx++];
    audio.play().catch(function(){setTimeout(next,120)});
  }
  audio.addEventListener('error',function(){if(idx<urls.length)next()});
  $('ball').style.display='flex';
  $('cover').innerHTML=m.cover?('<img src="'+esc(m.cover)+'" alt="">'):'&#9835;';
  $('mName').textContent=m.name||'背景音乐';$('mArtist').textContent=m.artist||'';
  $('ball').onclick=function(){$('player').classList.add('on');$('ball').style.display='none';if(!audio.src)next();else{audio.play().catch(function(){next()})}};
  $('mClose').onclick=function(){$('player').classList.remove('on');$('ball').style.display='flex'};
}
</script>
</body>
