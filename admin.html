<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>漫花鹿Pro 管理后台</title>
<meta name="theme-color" content="#2f6df6">
<link rel="icon" href="appicon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
 background:linear-gradient(170deg,#e9f1ff 0%,#f5f9ff 45%,#ffffff 100%);color:#161c2b;overflow:hidden}
#login{position:fixed;inset:0;overflow-y:auto;z-index:30}
.auth{max-width:420px;margin:0 auto;min-height:100%;padding:46px 22px 40px;display:flex;flex-direction:column;align-items:center;position:relative}
.glow{position:absolute;width:280px;height:280px;left:50%;top:-90px;transform:translateX(-50%);border-radius:50%;
 background:radial-gradient(circle,rgba(90,155,255,.30),rgba(90,155,255,0) 70%)}
.ico{width:76px;height:76px;border-radius:22px;display:block;box-shadow:0 14px 28px rgba(24,42,84,.18);position:relative;z-index:2}
.h1{font-size:23px;font-weight:800;margin-top:14px;position:relative;z-index:2}
.sub{font-size:11.5px;color:#8b95a8;letter-spacing:2px;margin-top:6px;position:relative;z-index:2}
.card{width:100%;margin-top:24px;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.92);border-radius:22px;
 padding:20px 18px;box-shadow:0 18px 40px rgba(24,42,84,.10);backdrop-filter:blur(16px);position:relative;z-index:2}
.label{font-size:12.5px;color:#7b8496;font-weight:700;margin:0 0 8px 2px;display:block}
.input{width:100%;height:50px;border:1px solid #e2e9f5;border-radius:16px;background:#fff;padding:0 16px;font-size:15px;outline:none;font-family:inherit;margin-bottom:14px}
.btn{width:100%;height:50px;border:0;border-radius:16px;font-size:16px;font-weight:800;
 background:linear-gradient(135deg,#2f6df6,#5a9bff);color:#fff;box-shadow:0 10px 24px rgba(47,109,246,.28)}
.btn.ghost{background:#fff;color:#33405a;border:1px solid #e2e9f5;box-shadow:none;margin-top:10px;font-weight:700}
.note{max-width:340px;text-align:center;font-size:11.5px;color:#95a0b2;line-height:1.8;margin-top:16px;position:relative;z-index:2}
#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:760px;display:none;flex-direction:column;background:#f4f6fb;
 box-shadow:0 0 40px rgba(24,42,84,.06)}
#app.on{display:flex}
.top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(255,255,255,.9);
 backdrop-filter:blur(14px);border-bottom:1px solid #eef1f7}
.top .tt{font-size:16px;font-weight:800}
.top .rt{font-size:12px;color:#2f6df6;font-weight:700;background:#eaf1ff;padding:5px 11px;border-radius:999px}
#pages{flex:1 1 auto;overflow-y:auto;padding:14px 14px 18px}
.gcard{background:rgba(255,255,255,.9);border:1px solid #e9eefa;border-radius:18px;padding:14px 16px;margin-bottom:12px;
 box-shadow:0 8px 20px rgba(24,42,84,.05);backdrop-filter:blur(10px)}
.gh{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;color:#5f6a80;margin-bottom:10px}
.srow{display:flex;align-items:center;gap:12px}
.sic{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#2f6df6,#7fb2ff);color:#fff;display:flex;
 align-items:center;justify-content:center;font-size:18px;font-weight:800}
.sm{flex:1;min-width:0}
.sn{font-size:16px;font-weight:800}
.sl{font-size:12px;color:#8a93a6;margin-top:4px}
.stat3{display:flex;margin-top:14px;border-top:1px solid #f1f4fa;padding-top:12px}
.stat3 div{flex:1;text-align:center}
.stat3 b{display:block;font-size:17px;font-weight:800}
.stat3 span{font-size:11.5px;color:#8a93a6}
.prow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f2f5fa;font-size:14px}
.prow:last-child{border-bottom:0}
.prow .v{color:#8a93a6;font-size:12.5px}
.la{color:#2f6df6;font-weight:700;text-decoration:none;font-size:13px}
.mi{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed #eef2f9}
.mi:last-child{border-bottom:0}
.mav{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:linear-gradient(135deg,#2f6df6,#7fb2ff);color:#fff;
 font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.mc{flex:1;min-width:0}
.mh{display:flex;justify-content:space-between;font-size:12px;color:#98a1b2}
.mh b{color:#33405a;font-size:12.5px}
.mt{font-size:13.5px;line-height:1.7;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.rep{display:flex;gap:8px;margin-top:12px}
.rep input{flex:1;height:42px;border:1px solid #e2e9f6;border-radius:11px;padding:0 12px;font-size:13.5px;outline:none;font-family:inherit}
.rep button{width:76px;height:42px;border:0;border-radius:11px;background:#2f6df6;color:#fff;font-size:13.5px;font-weight:800}
.empty{text-align:center;color:#a2aab9;font-size:13px;padding:26px 0}
.nav{flex:0 0 auto;display:flex;padding:6px 4px 8px;background:rgba(255,255,255,.78);backdrop-filter:blur(18px);
 border-top:1px solid rgba(0,0,0,.06)}
.nav .nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:#8a93a6;border:0;background:none;padding:4px 0}
.nav .nv.on{color:#2f6df6;font-weight:800}
.nav .nv svg{width:21px;height:21px;display:block}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,18px);background:rgba(28,36,52,.92);color:#fff;
 font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="login">
  <div class="auth">
    <div class="glow"></div>
    <img class="ico" src="appicon.png" alt="">
    <div class="h1">漫花鹿 Pro</div>
    <div class="sub">MANHUALA PRO · 管理后台</div>
    <div class="card">
      <label class="label">用户名或邮箱</label>
      <input class="input" id="au" placeholder="用户名 / 邮箱">
      <label class="label">密码</label>
      <input class="input" id="ap" type="password" placeholder="请输入密码">
      <button class="btn" id="doLogin">登 录 后 台</button>
      <button class="btn ghost" id="toReg">注册新账号</button>
    </div>
    <div class="note">后台与漫花鹿Pro 用同一个云端账号，登录后管理同一家店铺</div>
  </div>
</div>

<div id="app">
  <div class="top"><div class="tt" id="pgTitle">主页</div><div class="rt" id="pgVer">v1.7.94</div></div>
  <div id="pages"></div>
  <div class="nav">
    <button class="nv on" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg>主页</button>
    <button class="nv" data-nav="msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="18" height="13" rx="3"/><path d="M8 21l4-3"/></svg>消息</button>
    <button class="nv" data-nav="music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>听歌</button>
    <button class="nv" data-nav="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>设置</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var CLOUD='https://manhualu-cloud.netlify.app';
var SB='https://fjarlttqnznykmvlsxma.supabase.co/rest/v1';
var KEY='sb_publishable_2SUA34qjRy_yB_AgMYW81A_2KTzfL94';
var CUR={ver:'1.7.94',apk:'https://aka.doubaocdn.com/s/F8g5YAHPr1',note:''};
var DB=null,SHOP=null,TAB='home';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(window.__tt);window.__tt=setTimeout(function(){e.classList.remove('on')},1900)}
function cf(p,o){return fetch(CLOUD+p,o||{}).then(function(r){return r.json()})}
function sb(p,o){o=o||{};o.headers=Object.assign({'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},o.headers||{});return fetch(SB+p,o).then(function(r){return r.json()})}
function acc(){try{return JSON.parse(localStorage.getItem('mhl_adm_acc')||'null')}catch(e){return null}}

$('doLogin').onclick=function(){
  var u=$('au').value.trim(),p=$('ap').value;
  if(!u||!p){toast('请填写用户名和密码');return}
  cf('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
  .then(function(r){
    if(!r||!r.ok){toast(r&&r.msg?r.msg:'登录失败');return}
    localStorage.setItem('mhl_adm_acc',JSON.stringify({user:r.username,token:r.token}));
    toast('登录成功');enter();
  }).catch(function(){toast('网络不通')});
};
$('toReg').onclick=function(){
  var u=$('au').value.trim(),p=$('ap').value;
  if(!u||!p){toast('填好用户名密码再注册');return}
  var em=u.toLowerCase().replace(/[^a-z0-9]/g,'')+'@manhualu.local';
  cf('/reg',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,email:em,password:p})})
  .then(function(r){ if(!r||!r.ok){toast('注册失败');return} toast('注册成功，正在登录'); $('doLogin').click(); })
  .catch(function(){toast('网络不通')});
};

function enter(){
  $('login').style.display='none';$('app').classList.add('on');
  load();checkVer();
}
function load(){
  var a=acc();if(!a||!a.token){go(TAB);return}
  cf('/data',{headers:{'X-Token':a.token}}).then(function(d){
    var db=null;try{db=JSON.parse((d&&d.data)||'')}catch(e){}
    if(db&&db.shops)DB=db;
    var u=DB&&DB.users&&DB.users[String(a.user||'').toLowerCase()];
    SHOP=(u&&u.shopId&&DB.shops)?DB.shops[u.shopId]:null;
    if(!SHOP&&DB&&DB.shops){var ks=Object.keys(DB.shops);if(ks.length)SHOP=DB.shops[ks[0]];}
    go(TAB);
  }).catch(function(){go(TAB)});
}
function go(t){
  TAB=t;
  var nv=document.querySelectorAll('.nav .nv');
  for(var i=0;i<nv.length;i++)nv[i].classList.toggle('on',nv[i].getAttribute('data-nav')===t);
  $('pgTitle').textContent=({home:'主页',msg:'消息',music:'听歌',set:'设置'})[t];
  if(t==='home')rHome();if(t==='msg')rMsg();if(t==='music')rMusic();if(t==='set')rSet();
}
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-nav]'):null;if(b)go(b.getAttribute('data-nav'));
});
function rHome(){
  var s=SHOP;
  if(!s){$('pages').innerHTML='<div class="gcard"><div class="gh">我的店铺</div><div class="empty">这个账号还没有店铺<br>回漫花鹿Pro 开店后这里就会显示</div>'+
    '<div class="prow"><span>去前台</span><a class="la" href="web.html">登录网页版</a></div></div>';return}
  var pub='https://manhualupro.github.io/shop/'+(s.slug||'');
  $('pages').innerHTML='<div class="gcard"><div class="gh">我的店铺</div>'+
    '<div class="srow"><div class="sic">'+esc(String(s.name||'漫').slice(0,1))+'</div>'+
    '<div class="sm"><div class="sn">'+esc(s.name||'未命名')+'</div><div class="sl">/shop/'+esc(s.slug||'')+'</div></div></div>'+
    '<div class="stat3"><div><b>'+((s.prods||[]).length)+'</b><span>商品</span></div>'+
    '<div><b>'+(s.sales||0)+'</b><span>成交</span></div>'+
    '<div><b>'+(Math.round(Number(s.bond||0)*10)/10)+'</b><span>保证金</span></div></div></div>'+
    '<div class="gcard"><div class="gh">快捷</div>'+
    '<div class="prow"><span>打开店铺页</span><a class="la" href="'+pub+'" target="_blank" rel="noopener">打开</a></div>'+
    '<div class="prow"><span>下载 APK</span><a class="la" href="'+CUR.apk+'" target="_blank" rel="noopener">下载</a></div>'+
    '<div class="prow"><span>商品数</span><span class="v">'+((s.prods||[]).length)+' 个</span></div>'+
    '<div class="prow"><span>分类数</span><span class="v">'+((s.cats||[]).length)+' 个</span></div></div>';
}
function rMsg(){
  $('pages').innerHTML='<div class="gcard"><div class="gh">留言消息</div><div id="mb"><div class="empty">加载中…</div></div>'+
    '<div class="rep"><input id="rp" placeholder="回复最新一条…"><button id="rb">回复</button></div></div>';
  loadMsg();
}
function loadMsg(){
  sb('/shop?select=data&k=eq.msg').then(function(rows){
    var l=((rows&&rows[0]&&rows[0].data)||{}).list||[];window.__m=l;
    if(!l.length){$('mb').innerHTML='<div class="empty">还没有留言</div>';return}
    $('mb').innerHTML=l.slice(0,20).map(function(m){
      var re=m.reply?('<div style="margin-top:8px;background:#eef5ff;border-radius:10px;padding:8px 10px;font-size:12.5px;color:#2f6df6;line-height:1.7">回复：'+esc(m.reply)+'</div>'):'';
      return '<div class="mi"><div class="mav">'+esc(String(m.name||'漫').slice(0,1))+'</div><div class="mc">'+
        '<div class="mh"><b>'+esc(m.name||'匿名')+'</b><span>'+esc(m.at||'')+'</span></div>'+
        '<div class="mt">'+esc(m.txt)+'</div>'+re+'</div></div>';
    }).join('');
  }).catch(function(){$('mb').innerHTML='<div class="empty">读取失败</div>'});
}
document.addEventListener('click',function(e){
  if(!e.target.closest||!e.target.closest('#rb'))return;
  var t=$('rp').value.trim();if(!t){toast('先写回复');return}
  var l=window.__m||[];if(!l.length){toast('没有留言');return}
  l[0].reply=t;
  sb('/shop',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify([{k:'msg',data:{list:l}}])}).then(function(){toast('已回复');$('rp').value='';loadMsg();})
    .catch(function(){toast('回复失败')});
});
function rMusic(){
  var s=SHOP||{};var m=s.music||{};
  $('pages').innerHTML='<div class="gcard"><div class="gh">店铺背景音乐</div>'+
    '<div class="prow"><span>状态</span><span class="v">'+(m.local||m.id?'已设置':'未设置')+'</span></div>'+
    '<div class="prow"><span>歌曲</span><span class="v">'+esc((m.name||m.title||(m.id?'ID '+m.id:'无'))) +'</span></div>'+
    '<div class="empty">后台只显示状态，歌曲设置请回漫花鹿Pro 里改</div></div>';
}
function rSet(){
  var a=acc()||{user:'未登录'};
  $('pages').innerHTML='<div class="gcard"><div class="gh">账号</div>'+
    '<div class="prow"><span>后台账号</span><span class="v">'+esc(a.user)+'</span></div>'+
    '<div class="prow"><span>漫花鹿Pro 账号</span><span class="v">同上（同一个云端账号）</span></div></div>'+
    '<div class="gcard"><div class="gh">版本</div>'+
    '<div class="prow"><span>当前版本</span><span class="v">v'+CUR.ver+'</span></div>'+
    '<div class="prow"><span>检查更新</span><a class="la" id="ck" href="#">检查</a></div></div>'+
    '<div class="gcard"><div class="gh">其他</div>'+
    '<div class="prow"><span>返回前台</span><a class="la" href="web.html">去前台</a></div>'+
    '<div class="prow"><span>退出登录</span><a class="la" id="lo" href="#">退出</a></div></div>';
  $('ck').onclick=function(e){e.preventDefault();checkVer(true)};
  $('lo').onclick=function(e){e.preventDefault();localStorage.removeItem('mhl_adm_acc');location.reload()};
}
function checkVer(manual){
  sb('/shop?select=data&k=eq.app').then(function(rows){
    var d=(rows&&rows[0]&&rows[0].data)||{};
    if(d.ver)CUR.ver=d.ver;if(d.apk)CUR.apk=d.apk;if(d.note)CUR.note=d.note;
    $('pgVer').textContent='v'+CUR.ver;
    if(manual)toast('当前版本 v'+CUR.ver);
  }).catch(function(){if(manual)toast('检查失败')});
}
var a0=acc(); if(a0&&a0.token){enter()}
</script>
</body>
</html>
