<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>漫花鹿Pro 后台</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fb;color:#1f2430;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
.top{padding:16px 16px 14px;background:#2f6df6;color:#fff}
.top b{font-size:17px;display:block}
.top span{font-size:12px;opacity:.85;display:block;margin-top:4px;word-break:break-all}
.wrap{max-width:680px;margin:0 auto}
.page{padding:14px}
.card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 4px 16px rgba(17,24,39,.06);margin-bottom:12px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f1f3f8;font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 16px rgba(17,24,39,.06)}
.stat i{font-style:normal;font-size:12px;color:#8b90a0;display:block}
.stat b{font-size:20px;display:block;margin-top:6px}
.lab{font-size:12px;color:#8b90a0;margin:2px 0 8px}
.thread{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 4px 16px rgba(17,24,39,.06)}
.thread .av{width:38px;height:38px;border-radius:50%;background:#eef2ff;color:#2f6df6;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.thread .m{flex:1 1 auto;min-width:0}
.thread .m b{font-size:14px;display:block}
.thread .m i{font-style:normal;font-size:12px;color:#8b90a0;display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread .t{font-size:11px;color:#a3a8b8;flex:0 0 auto}
.cbox{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:20}
.cbox.on{display:flex}
.cbox .chd{padding:14px 16px;border-bottom:1px solid #eef0f5;display:flex;align-items:center;gap:10px}
.cbox .chd button{border:0;background:#f2f4f8;border-radius:10px;width:34px;height:34px;font-size:16px;color:#6b7280}
.cbox .chd b{font-size:15px}
.clist{flex:1 1 auto;overflow-y:auto;padding:14px;background:#f7f8fc}
.cmsg{display:flex;margin-bottom:10px}
.cmsg .bub{max-width:76%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word}
.cmsg.b .bub{background:#fff;border:1px solid #e9ecf3;color:#222}
.cmsg.s{justify-content:flex-end}
.cmsg.s .bub{background:#2f6df6;color:#fff}
.cmsg .tm{font-size:11px;color:#a3a8b8;margin-top:4px}
.cfoot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #eef0f5;align-items:center;background:#fff}
.cfoot input{flex:1 1 auto;min-width:0;border:1px solid #e3e7f0;border-radius:10px;padding:10px 12px;font-size:16px;outline:none}
.cfoot button{border:0;background:#2f6df6;color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600}
.empty{padding:40px 0;text-align:center;color:#a3a8b8;font-size:13px}
/* 底部原生风导航 */
.nav{position:fixed;left:0;right:0;bottom:0;height:68px;padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border-top:1px solid rgba(17,24,39,.08);z-index:30}
.nav a{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#8b90a0;font-size:12px;position:relative}
.nav a.on{color:#2f6df6;font-weight:600}
.nav a svg{width:22px;height:22px}
.nav .dot{position:absolute;top:8px;right:calc(50% - 20px);width:7px;height:7px;border-radius:50%;background:#ff4d6a;display:none}
.nav .dot.on{display:block}
.login{padding:40px 18px}
.login h1{font-size:18px;margin:0 0 6px}
.login p{font-size:13px;color:#8b90a0;margin:0 0 18px}
.login input{width:100%;border:1px solid #e3e7f0;border-radius:12px;padding:12px 14px;font-size:16px;outline:none;margin-bottom:10px}
.login button{width:100%;border:0;background:#2f6df6;color:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="wrap">
    <h1>店铺后台</h1>
    <p>输入你的店铺后缀（公网地址最后那一段）进入</p>
    <input id="slug" placeholder="例如 niulai">
    <button id="go">进入后台</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="top"><div class="wrap"><b id="sname">店铺</b><span id="surl"></span></div></div>
  <div class="wrap">
    <div class="page" id="pageHome">
      <div class="grid" style="margin-bottom:12px">
        <div class="stat"><i>商品数</i><b id="stGoods">0</b></div>
        <div class="stat"><i>卡密库存</i><b id="stKeys">0</b></div>
        <div class="stat"><i>订单数</i><b id="stOrders">0</b></div>
        <div class="stat"><i>成交额</i><b id="stMoney">0</b></div>
      </div>
      <div class="card">
        <div class="lab">店铺信息</div>
        <div class="kv"><span>店名</span><b id="iName">-</b></div>
        <div class="kv"><span>开店时间</span><b id="iCreated">-</b></div>
        <div class="kv"><span>公网后缀</span><b id="iSlug">-</b></div>
        <div class="kv"><span>客服会话</span><b id="iThreads">0</b></div>
      </div>
      <div class="card">
        <div class="lab">最近订单</div>
        <div id="orders"><div class="empty">还没有订单</div></div>
      </div>
    </div>

    <div class="page" id="pageChat" style="display:none">
      <div class="lab">全部会话（点开即可回复）</div>
      <div id="threads"><div class="empty">还没有人找你</div></div>
    </div>
  </div>
</div>

<div class="cbox" id="cbox">
  <div class="chd"><button id="back">&#10094;</button><b id="cwho">会话</b><span style="margin-left:auto;font-size:12px;color:#a3a8b8" id="cstat"></span></div>
  <div class="clist" id="clist"></div>
  <div class="cfoot"><input id="cin" placeholder="回复买家…" maxlength="500"><button id="csend">发送</button></div>
</div>

<div class="nav" id="nav" style="display:none">
  <a class="on" data-tab="home"><svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20H4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>主页</a>
  <a data-tab="chat"><span class="dot" id="dot"></span><svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.4 8.4 0 0 1-8.4 8.4 8.6 8.6 0 0 1-3.9-.9L3 21l1.9-5.7a8.4 8.4 0 1 1 16.1-3.8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>后台聊天</a>
</div>

<script>
var SB_URL='https://fjarlttqnznykmvlsxma.supabase.co/rest/v1';
var SB_KEY='sb_publishable_2SUA34qjRy_yB_AgMYW81A_2KTzfL94';
var PUB='https://manhualupro.github.io/shop/';
var slug='',shop={},threads=[],curThread='',pollT=null;
var known={};try{known=JSON.parse(localStorage.getItem('mhl_admin_known')||'{}')}catch(e){known={}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hdr(extra){var h={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};for(var k in extra||{})h[k]=extra[k];return h}
function fmtTm(t){var d=new Date(t||Date.now());return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function fmtDay(t){var d=new Date(t||Date.now());return (d.getMonth()+1)+'/'+d.getDate()}
function start(){
  var s=new URLSearchParams(location.search).get('s');
  if(!s){
    var p=location.pathname.split('/').filter(function(x){return x}).filter(function(x){return x!=='shop'&&x!=='admin'});
    if(p.length)s=decodeURIComponent(p[p.length-1]);
  }
  if(s){$('slug').value=s;enter(s)}
  $('go').onclick=function(){var v=$('slug').value.trim().toLowerCase();if(v)enter(v)};
}
function enter(s){
  slug=s;
  fetch(SB_URL+'/shop?select=data&k=eq.'+encodeURIComponent(slug),{headers:hdr()})
    .then(function(r){return r.json()})
    .then(function(rows){
      if(!rows||!rows.length){alert('这个后缀没有店铺：'+slug);return}
      shop=(rows[0].data)||{};
      $('login').style.display='none';$('app').style.display='block';$('nav').style.display='flex';
      $('sname').textContent=shop.name||'我的店铺';
      $('surl').textContent=PUB+slug;
      $('iName').textContent=shop.name||'-';
      $('iCreated').textContent=shop.created||'-';
      $('iSlug').textContent=slug;
      var prods=shop.prods||[],keys=0;prods.forEach(function(p){keys+=(p.keys||[]).length});
      $('stGoods').textContent=prods.length;
      $('stKeys').textContent=keys;
      loadChat(true);loadOrders();
      pollT=setInterval(function(){loadChat(false)},6000);
    })
    .catch(function(){alert('打开失败，检查网络')});
}
function loadOrders(){
  fetch(SB_URL+'/orders?select=no,data,ts&shop=eq.'+encodeURIComponent(slug)+'&order=ts.desc&limit=20',{headers:hdr()})
    .then(function(r){return r.json()})
    .then(function(rows){
      var sum=0;rows.forEach(function(o){sum+=Number((o.data&&o.data.price)||0)});
      $('stOrders').textContent=rows.length;$('stMoney').textContent='¥'+sum;
      if(!rows.length)return;
      $('orders').innerHTML=rows.map(function(o){
        var d=o.data||{};
        return '<div class="kv"><span>'+(esc(d.goods||d.no||o.no))+'</span><b>¥'+(Number(d.price)||0)+'</b></div>';
      }).join('');
    }).catch(function(){});
}
function loadChat(first){
  fetch(SB_URL+'/chat?select=shop,thread,who,txt,ts&shop=eq.'+encodeURIComponent(slug)+'&order=ts.desc&limit=400',{headers:hdr()})
    .then(function(r){return r.json()})
    .then(function(rows){
      var map={};
      rows.slice().reverse().forEach(function(r){
        if(!map[r.thread])map[r.thread]={id:r.thread,last:r.txt,ts:r.ts,n:0};
        map[r.thread].last=r.txt;map[r.thread].ts=r.ts;map[r.thread].n++;
      });
      threads=Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return new Date(b.ts)-new Date(a.ts)});
      $('iThreads').textContent=threads.length;
      $('threads').innerHTML=threads.length?threads.map(function(t,i){
        return '<div class="thread" data-i="'+i+'"><div class="av">'+(i+1)+'</div><div class="m"><b>买家 '+
          esc(t.id.slice(-4))+'</b><i>'+esc(t.last)+'</i></div><div class="t">'+fmtDay(t.ts)+'<br>'+fmtTm(t.ts)+'</div></div>';
      }).join(''):'<div class="empty">还没有人找你</div>';
      [].forEach.call(document.querySelectorAll('.thread'),function(el){
        el.onclick=function(){openThread(threads[+el.getAttribute('data-i')].id)};
      });
      if(curThread)renderConv(curThread);
    }).catch(function(){});
}
function openThread(id){
  curThread=id;
  $('cwho').textContent='买家 '+id.slice(-4);
  $('cbox').classList.add('on');
  $('cstat').textContent='';
  loadConv();
}
function loadConv(){
  if(!curThread)return;
  fetch(SB_URL+'/chat?select=who,txt,ts&shop=eq.'+encodeURIComponent(slug)+'&thread=eq.'+encodeURIComponent(curThread)+'&order=ts.asc&limit=300',{headers:hdr()})
    .then(function(r){return r.json()})
    .then(function(rows){
      $('clist').innerHTML=rows.map(function(r){
        var side=r.who==='s'?'s':'b';
        return '<div class="cmsg '+side+'"><div><div class="bub">'+esc(r.txt).replace(/\n/g,'<br>')+'</div>'+
          '<div class="tm" style="text-align:'+(side==='s'?'right':'left')+'">'+fmtTm(r.ts)+'</div></div></div>';
      }).join('')||'<div class="empty">还没有消息</div>';
      $('clist').scrollTop=$('clist').scrollHeight;
      $('cstat').textContent=rows.length+' 条';
    }).catch(function(){});
}
function sendReply(){
  var v=$('cin').value.trim();if(!v||!curThread)return;
  $('cin').value='';
  fetch(SB_URL+'/chat',{method:'POST',headers:hdr({'Content-Type':'application/json','Prefer':'return=representation'}),
    body:JSON.stringify([{shop:slug,thread:curThread,who:'s',txt:v}])})
    .then(function(){loadConv();loadChat(false)})
    .catch(function(){alert('发送失败，检查网络')});
}
/* 交互绑定 */
$('back').onclick=function(){$('cbox').classList.remove('on');loadChat(false)};
$('csend').onclick=sendReply;
$('cin').addEventListener('keydown',function(e){if(e.key==='Enter')sendReply()});
[].forEach.call(document.querySelectorAll('.nav a'),function(a){
  a.onclick=function(){
    [].forEach.call(document.querySelectorAll('.nav a'),function(x){x.classList.remove('on')});
    a.classList.add('on');
    var t=a.getAttribute('data-tab');
    $('pageHome').style.display=(t==='home'?'block':'none');
    $('pageChat').style.display=(t==='chat'?'block':'none');
    if(t==='chat')loadChat(false);
  };
});
start();
</script>
</body>
</html>
